<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Grid 4 + 4 + 3 contoh</title>
  <style>
    :root{
      --gap:16px;
      --card-bg:#f7f7fb;
      --card-border:#e1e4ec;
      --card-radius:8px;
    }

    body{
      font-family: system-ui, Roboto, "Segoe UI", Arial;
      margin:24px;
      background:#fff;
      color:#111;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* 4 kolom di layar lebar -> otomatis 4/4/3 untuk 11 item */
      gap: var(--gap);
      align-items: start;
    }

    .card{
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--card-radius);
      padding: 16px;
      box-sizing: border-box;
      min-height: 100px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
    }

    .card .title{
      font-weight:600;
      margin-bottom:8px;
    }

    .card .price{
      color:#0b6;
      font-weight:700;
    }

    /* -- Opsi: centering visual untuk baris terakhir jika hanya ada 1/2/3 item tersisa.
       Ini hanya memindahkan 1..3 item terakhir agar terlihat center dalam grid.
       Kalau tidak ingin, baris ini dapat dihapus. -- */

    /* Pusatkan jika 3 item terakhir */
    .products > *:nth-last-child(-n+3){
      /* gunakan justify-self untuk horizontal centering pada cell grid */
      justify-self: center;
      width: calc(100% - var(--gap)); /* biar card tidak melebihi kolom ketika di-center */
      max-width: 320px;
    }

    /* Make sure in normal rows items stretch full width */
    .products > * { justify-self: stretch; }

    /* RESPONSIVE: sesuaikan kolom di layar sedang/kecil */
    @media (max-width: 1024px){
      .products { grid-template-columns: repeat(3, 1fr); } /* 3 kolom */
      /* ubah centering rule: last row 1..2..3 juga diberlakukan */
      .products > *:nth-last-child(-n+3){
        justify-self: center;
        width: calc(100% - var(--gap));
      }
    }

    @media (max-width: 720px){
      .products { grid-template-columns: repeat(2, 1fr); } /* 2 kolom */
      .products > *:nth-last-child(-n+2){
        justify-self: center;
        width: calc(100% - var(--gap));
        max-width: 420px;
      }
    }

    @media (max-width: 420px){
      .products { grid-template-columns: 1fr; } /* 1 kolom */
      .products > * { justify-self: stretch; width: auto; max-width:none; }
    }

  </style>
</head>
<body>

  <h2>Contoh produk (11 item)</h2>

  <div class="products">
    <div class="card"><div class="title">Product 1</div><div class="price">Rp 100.000</div></div>
    <div class="card"><div class="title">Product 2</div><div class="price">Rp 120.000</div></div>
    <div class="card"><div class="title">Product 3</div><div class="price">Rp 90.000</div></div>
    <div class="card"><div class="title">Product 4</div><div class="price">Rp 150.000</div></div>

    <div class="card"><div class="title">Product 5</div><div class="price">Rp 110.000</div></div>
    <div class="card"><div class="title">Product 6</div><div class="price">Rp 95.000</div></div>
    <div class="card"><div class="title">Product 7</div><div class="price">Rp 130.000</div></div>
    <div class="card"><div class="title">Product 8</div><div class="price">Rp 140.000</div></div>

    <div class="card"><div class="title">Product 9</div><div class="price">Rp 85.000</div></div>
    <div class="card"><div class="title">Product 10</div><div class="price">Rp 160.000</div></div>
    <div class="card"><div class="title">Product 11</div><div class="price">Rp 200.000</div></div>
  </div>

</body>
</html>
